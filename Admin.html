<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <style>
    :root {
      --ink: #1C1917;
      --paper: #F5F4F1;
      --line: #E7E3DB;
      --orange: #E8590C;
      --teal: #0F766E;
      --blue: #2563EB;
      --gray: #78716C;
      --danger: #B91C1C;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    /* ---- PIN gate ---- */
    #gate {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    #gate h2 { margin: 0 0 4px; }
    #gate input {
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-size: 20px;
      letter-spacing: 4px;
      text-align: center;
      width: 160px;
    }
    #gate button {
      padding: 10px 24px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    #gate .err { color: var(--danger); font-size: 13px; height: 16px; }

    /* ---- Main layout ---- */
    #app { display: none; }
    .topbar {
      background: var(--ink);
      color: #fff;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .topbar h1 { font-size: 18px; margin: 0; }
    .tabs { display: flex; gap: 4px; }
    .tabs button {
      background: none; border: none; color: #D6D3D1;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit;
    }
    .tabs button.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 700; }

    .container { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .hint { font-size: 12px; color: var(--gray); margin: 10px 2px 0; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    }
    .stat-card .num { font-size: 28px; font-weight: 800; }
    .stat-card .label { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .stat-card.pending .num { color: var(--gray); }
    .stat-card.progress .num { color: var(--blue); }
    .stat-card.done .num { color: var(--teal); }
    .stat-card.week .num { color: var(--orange); }

    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .chart-card h3 { margin: 0 0 12px; font-size: 14px; color: var(--gray); }
    /* ล็อกความสูงกราฟ ไม่ให้ยืดตามความกว้างการ์ด */
    .canvas-box { position: relative; height: 260px; }
    @media (max-width: 700px) { .canvas-box { height: 220px; } }

    /* ---- Table ---- */
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filters input, .filters select {
      padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 13px;
    }
    #searchBox { min-width: 260px; }
    /* separate + spacing 0 ให้ผลเหมือน collapse แต่ position:sticky บนเซลล์ถึงจะทำงาน
       และห้ามใส่ overflow บน table เพราะจะทำให้เซลล์ sticky ยึดกับตารางแทนกรอบที่เลื่อน */
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); }
    th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
    th { background: #EFECE6; color: var(--gray); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: #FFFBF7; }
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .badge.รอดำเนินการ { background: #EEE; color: var(--gray); }
    .badge.กำลังซ่อม { background: #DBEAFE; color: var(--blue); }
    .badge.เสร็จสิ้น { background: #D1FAE5; color: var(--teal); }
    .badge.ปิดงาน { background: #E0E7FF; color: #4338CA; }
    .badge.ยกเลิก { background: #FEE2E2; color: var(--danger); }
    td select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; }
    /* ตารางเลื่อนแนวนอนได้อยู่แล้ว จึงไม่ตัดคำ ยกเว้นคอลัมน์ข้อความยาว */
    .table-wrap th, .table-wrap td { white-space: nowrap; }
    .table-wrap th.desc, .table-wrap td.desc { white-space: normal; min-width: 180px; max-width: 320px; }
    .ticket-cell { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
    .ticket-cell .sccd { font-weight: 400; font-size: 11px; color: var(--gray); }
    .prio {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 700; background: #EFECE6; color: var(--gray);
    }
    .prio.สูง { background: #FFEDD5; color: #C2410C; }
    .prio.เร่งด่วน { background: #FEE2E2; color: var(--danger); }

    /* ตารางกว้างกว่าจอ — ตรึงคอลัมน์ Ticket ไว้ซ้ายมือขณะเลื่อนแนวนอน */
    @media (min-width: 901px) {
      .table-wrap th:first-child, .table-wrap td:first-child {
        position: sticky; left: 0; z-index: 1;
        box-shadow: 1px 0 0 var(--line);
      }
      .table-wrap td:first-child { background: var(--card); }
      .table-wrap th:first-child { background: #EFECE6; z-index: 2; }
      .table-wrap tr:hover td:first-child { background: #FFFBF7; }
    }
    .link { color: var(--blue); text-decoration: underline; cursor: pointer; font-size: 12px; }
    .link.danger { color: var(--danger); }
    #loadingRow td { text-align: center; color: var(--gray); padding: 30px; }

    /* ---- ฟอร์มเพิ่มช่าง ---- */
    .tech-add {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; margin-bottom: 16px;
      display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
    }
    .tech-add .field { display: flex; flex-direction: column; gap: 4px; }
    .tech-add label { font-size: 11px; color: var(--gray); font-weight: 700; }
    .tech-add input {
      padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px;
      font-family: inherit; font-size: 13px; min-width: 180px;
    }
    .tech-add button {
      padding: 9px 20px; background: var(--orange); color: #fff; border: none;
      border-radius: 6px; font-weight: 700; font-family: inherit; font-size: 13px; cursor: pointer;
    }
    .tech-add button:disabled { opacity: 0.5; cursor: default; }
    .tech-add .msg { font-size: 12px; color: var(--danger); flex-basis: 100%; min-height: 14px; }
    tr.inactive td:not(:last-child) { opacity: 0.45; }

    /* ================= RESPONSIVE ================= */

    /* ตารางกว้างเกินจอ — ให้เลื่อนแนวนอนได้แทนที่จะดันหน้าเว็บให้กว้าง */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      background: var(--card);
    }

    /* ตารางงาน 9 คอลัมน์เริ่มบีบจนอ่านไม่ออกตั้งแต่ ~900px จึงสลับเป็นการ์ดตั้งแต่ช่วงแท็บเล็ต */
    @media (max-width: 900px) {
      .container { padding: 16px; }
      .chart-row { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; }
      .topbar h1 { font-size: 16px; text-align: center; }
      .tabs { justify-content: center; flex-wrap: wrap; }
      .tabs button { flex: 1; min-width: 100px; padding: 10px 8px; }

      .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 12px; }
      .stat-card .num { font-size: 22px; }

      .filters { gap: 6px; }
      .filters input, .filters select { flex: 1 1 100%; font-size: 16px; }
      #searchBox { min-width: 0; }

      /* ตารางงาน + ตารางช่าง เปลี่ยนเป็นการ์ดแนวตั้ง อ่านง่ายกว่าเลื่อนซ้ายขวา */
      .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
      .table-wrap thead { display: none; }
      .table-wrap { overflow-x: visible; }
      .table-wrap table { background: none; }
      .table-wrap tr {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 6px 12px;
      }
      .table-wrap tr:hover { background: var(--card); }
      .table-wrap td {
        border: none;
        padding: 7px 0;
        white-space: normal;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: right;
      }
      .table-wrap td + td { border-top: 1px dashed var(--line); }
      .table-wrap td::before {
        content: attr(data-label);
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 700;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: left;
      }
      .table-wrap td[data-label=""]::before { display: none; }
      .table-wrap td.empty { display: block; text-align: center; }
      .table-wrap td.empty::before { display: none; }
      .table-wrap td.desc { flex-direction: column; align-items: flex-start; text-align: left; }
      .table-wrap td.desc::before { margin-bottom: 2px; }
      .table-wrap td select { font-size: 14px; padding: 7px 8px; max-width: 60%; }
      .table-wrap td[style*="max-width"] { max-width: none !important; }
      .table-wrap .actions { justify-content: flex-end; gap: 14px; }
      .table-wrap .link { font-size: 13px; }

      .tech-add { padding: 14px; }
      .tech-add .field { flex: 1 1 100%; }
      .tech-add input { min-width: 0; width: 100%; font-size: 16px; }
      .tech-add button { flex: 1 1 100%; padding: 12px; }
    }
  </style>
</head>
<body>

  <div id="gate">
    <h2>🔒 เข้าสู่หน้าแอดมิน</h2>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
    <button id="pinBtn">เข้าสู่ระบบ</button>
    <div class="err" id="pinErr"></div>
  </div>

  <div id="app">
    <div class="topbar">
      <h1>🔧 ระบบแจ้งซ่อม — Admin</h1>
      <div class="tabs">
        <button id="tabDash" class="active">Dashboard</button>
        <button id="tabList">รายการงาน</button>
        <button id="tabTech">จัดการช่าง</button>
      </div>
    </div>

    <div class="container">
      <div id="viewDash">
        <div class="stat-grid" id="statGrid"></div>
        <div class="chart-row">
          <div class="chart-card"><h3>งานตามสถานะ</h3><div class="canvas-box"><canvas id="statusChart"></canvas></div></div>
          <div class="chart-card"><h3>งานตามประเภท</h3><div class="canvas-box"><canvas id="categoryChart"></canvas></div></div>
        </div>
      </div>

      <div id="viewList" style="display:none">
        <div class="filters">
          <input id="searchBox" placeholder="ค้นหาจากทุกคอลัมน์ (Ticket / SCCD / ชื่อ / สถานที่ ...)">
          <select id="statusFilter">
            <option value="">ทุกสถานะ</option>
            <option>รอดำเนินการ</option>
            <option>กำลังซ่อม</option>
            <option>เสร็จสิ้น</option>
            <option>ปิดงาน</option>
            <option>ยกเลิก</option>
          </select>
          <span class="link" id="refreshBtn">🔄 รีเฟรช</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="ticketHead"></thead>
            <tbody id="ticketBody">
              <tr id="loadingRow"><td class="empty" colspan="99">กำลังโหลด...</td></tr>
            </tbody>
          </table>
        </div>
        <p class="hint" id="tableHint"></p>
      </div>

      <div id="viewTech" style="display:none">
        <div class="tech-add">
          <div class="field">
            <label for="techName">ชื่อช่าง</label>
            <input id="techName" placeholder="เช่น ช่างสมชาย" maxlength="60">
          </div>
          <div class="field">
            <label for="techPhone">เบอร์โทร (ไม่บังคับ)</label>
            <input id="techPhone" placeholder="08xxxxxxxx" maxlength="20">
          </div>
          <button id="techAddBtn">+ เพิ่มช่าง</button>
          <div class="msg" id="techMsg"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ชื่อช่าง</th><th>เบอร์โทร</th><th>สถานะ</th><th>งานที่ถืออยู่</th><th></th></tr>
            </thead>
            <tbody id="techBody">
              <tr><td class="empty" colspan="5" style="text-align:center;color:#78716C;padding:30px">กำลังโหลด...</td></tr>
            </tbody>
          </table>
        </div>
        <p style="font-size:12px;color:#78716C">
          ช่างที่ <b>ปิดใช้งาน</b> จะไม่แสดงในช่อง "ผู้รับผิดชอบ" ของงานใหม่ แต่ประวัติงานเดิมยังคงอยู่
        </p>
      </div>
    </div>
  </div>

  <script>
    let PIN = '';
    let allTickets = [];
    let ticketHeaders = [];    // ชื่อคอลัมน์ตามลำดับจริงในชีท Requests
    let technicians = [];      // ชื่อช่างที่เปิดใช้งาน (สำหรับ dropdown มอบหมาย)
    let techniciansAll = [];   // ข้อมูลช่างทั้งหมด (สำหรับแท็บจัดการช่าง)
    let statusChart, categoryChart;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('pinBtn').addEventListener('click', tryLogin);
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

    function tryLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin) return;
      google.script.run
        .withSuccessHandler(ok => {
          if (ok) {
            PIN = pin;
            document.getElementById('gate').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadAll();
          } else {
            document.getElementById('pinErr').textContent = 'PIN ไม่ถูกต้อง';
          }
        })
        .checkAdminPin(pin);
    }

    function loadAll() {
      google.script.run.withSuccessHandler(renderStats).getDashboardStats(PIN);
      google.script.run.withSuccessHandler(list => {
        techniciansAll = list;
        technicians = list.filter(t => t.active).map(t => t.name);
        renderTable();
        renderTechTable();
      }).getTechniciansAll(PIN);
      google.script.run.withSuccessHandler(res => {
        ticketHeaders = res.headers || [];
        allTickets = res.rows || [];
        renderTable();
        renderTechTable();   // อัปเดตคอลัมน์ "งานที่ถืออยู่"
      }).getAllTickets(PIN);
    }

    function renderStats(stats) {
      const grid = document.getElementById('statGrid');
      grid.innerHTML = `
        <div class="stat-card"><div class="num">${stats.total}</div><div class="label">งานทั้งหมด</div></div>
        <div class="stat-card pending"><div class="num">${stats.byStatus['รอดำเนินการ']||0}</div><div class="label">รอดำเนินการ</div></div>
        <div class="stat-card progress"><div class="num">${stats.byStatus['กำลังซ่อม']||0}</div><div class="label">กำลังซ่อม</div></div>
        <div class="stat-card done"><div class="num">${(stats.byStatus['เสร็จสิ้น']||0)+(stats.byStatus['ปิดงาน']||0)}</div><div class="label">เสร็จสิ้น/ปิดงาน</div></div>
        <div class="stat-card week"><div class="num">${stats.last7days}</div><div class="label">แจ้งใน 7 วันล่าสุด</div></div>
      `;

      const statusLabels = Object.keys(stats.byStatus);
      const statusData = statusLabels.map(k => stats.byStatus[k]);
      if (statusChart) statusChart.destroy();
      statusChart = new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: { labels: statusLabels, datasets: [{ data: statusData,
          backgroundColor: ['#78716C','#2563EB','#0F766E','#4338CA','#B91C1C'] }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } }
        }
      });

      const catLabels = Object.keys(stats.byCategory);
      const catData = catLabels.map(k => stats.byCategory[k]);
      if (categoryChart) categoryChart.destroy();
      categoryChart = new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: { labels: catLabels, datasets: [{ data: catData, backgroundColor: '#E8590C' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } },
            x: { ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 0, autoSkip: false } }
          }
        }
      });
    }

    // ชื่อหัวคอลัมน์ภาษาไทย — คอลัมน์ที่ไม่ได้อยู่ในนี้ (เช่นที่เพิ่มเองในชีทภายหลัง) จะใช้ชื่อจากชีทตรงๆ
    const HEADER_LABELS = {
      TicketID: 'Ticket', SCCD: 'SCCD/ITSM', Timestamp: 'วันที่แจ้ง', ReporterType: 'ประเภทผู้แจ้ง',
      ReporterName: 'ผู้แจ้ง', Contact: 'ติดต่อ', Department: 'แผนก', Location: 'สถานที่',
      Category: 'ประเภทงาน', Description: 'รายละเอียด', PhotoURL: 'รูป', Status: 'สถานะ',
      Priority: 'ความเร่งด่วน', AssignedTo: 'ผู้รับผิดชอบ', UpdatedAt: 'อัปเดตล่าสุด',
      ClosedAt: 'ปิดงานเมื่อ', Notes: 'หมายเหตุ'
    };
    const DATE_COLS = ['Timestamp', 'UpdatedAt', 'ClosedAt'];
    const WRAP_COLS = ['Description', 'Notes'];   // คอลัมน์ข้อความยาว ให้ตัดบรรทัดได้

    function labelOf(h) { return HEADER_LABELS[h] || h; }

    function fmtDate(v) {
      if (!v) return '-';
      const d = new Date(v);
      if (isNaN(d.getTime())) return esc(v);
      return d.toLocaleDateString('th-TH', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
    }

    // เนื้อหาในเซลล์ แยกตามชนิดของคอลัมน์
    function cellHtml(t, h) {
      const raw = t[h];
      if (DATE_COLS.indexOf(h) !== -1) return fmtDate(raw);

      if (h === 'PhotoURL') {
        return raw ? `<a class="link" href="${esc(raw)}" target="_blank" rel="noopener">ดูรูป</a>` : '-';
      }
      if (h === 'Status') {
        const opts = ['รอดำเนินการ','กำลังซ่อม','เสร็จสิ้น','ปิดงาน','ยกเลิก']
          .map(s => `<option value="${s}" ${raw===s?'selected':''}>${s}</option>`).join('');
        return `<select onchange="updateField('${t.TicketID}','status',this.value)">${opts}</select>`;
      }
      if (h === 'AssignedTo') {
        // ถ้ามอบหมายให้ช่างที่ถูกปิดใช้งาน/ลบไปแล้ว ให้ยังแสดงชื่อเดิมไว้ในตัวเลือก
        const assigned = String(raw || '').trim();
        const names = technicians.slice();
        if (assigned && names.indexOf(assigned) === -1) names.push(assigned + ' (ไม่ใช้งาน)');
        const opts = ['-- ยังไม่มอบหมาย --', ...names].map(name => {
          const val = name.replace(' (ไม่ใช้งาน)', '');
          return `<option value="${esc(val)}" ${assigned===val?'selected':''}>${esc(name)}</option>`;
        }).join('');
        return `<select onchange="updateField('${t.TicketID}','assignedTo',this.value)">${opts}</select>`;
      }
      if (h === 'Priority' && raw) {
        return `<span class="prio ${esc(raw)}">${esc(raw)}</span>`;
      }
      return raw === '' || raw === null || raw === undefined ? '-' : esc(raw);
    }

    function renderTable() {
      const search = document.getElementById('searchBox').value.trim().toLowerCase();
      const statusF = document.getElementById('statusFilter').value;
      const head = document.getElementById('ticketHead');
      const body = document.getElementById('ticketBody');
      const cols = ticketHeaders.length ? ticketHeaders : ['TicketID'];

      head.innerHTML = '<tr>' + cols.map(h =>
        `<th class="${WRAP_COLS.indexOf(h) !== -1 ? 'desc' : ''}">${esc(labelOf(h))}</th>`).join('') + '</tr>';

      const filtered = allTickets.filter(t => {
        // ค้นหาจากทุกคอลัมน์
        const matchSearch = !search || cols.some(h => String(t[h] == null ? '' : t[h]).toLowerCase().includes(search));
        const matchStatus = !statusF || t.Status === statusF;
        return matchSearch && matchStatus;
      });

      document.getElementById('tableHint').textContent = allTickets.length
        ? `แสดง ${filtered.length} จาก ${allTickets.length} งาน — ${cols.length} คอลัมน์ตามชีท Requests (เลื่อนตารางแนวนอนเพื่อดูคอลัมน์ที่เหลือ)`
        : '';

      if (filtered.length === 0) {
        body.innerHTML = `<tr><td class="empty" colspan="${cols.length}" style="text-align:center;color:#78716C;padding:30px">ไม่พบรายการ</td></tr>`;
        return;
      }

      body.innerHTML = filtered.map(t => '<tr>' + cols.map(h => {
        const cls = [
          h === 'TicketID' ? 'ticket-cell' : '',
          WRAP_COLS.indexOf(h) !== -1 ? 'desc' : ''
        ].filter(String).join(' ');
        return `<td class="${cls}" data-label="${esc(labelOf(h))}">${cellHtml(t, h)}</td>`;
      }).join('') + '</tr>').join('');
    }

    function updateField(ticketId, field, value) {
      const updates = {};
      updates[field] = field === 'assignedTo' && value.startsWith('--') ? '' : value;
      google.script.run
        .withSuccessHandler(() => { loadAll(); })
        .withFailureHandler(err => alert('อัปเดตไม่สำเร็จ: ' + err.message))
        .updateTicket(PIN, ticketId, updates);
    }

    // ---- จัดการช่าง ----
    function renderTechTable() {
      const body = document.getElementById('techBody');
      if (techniciansAll.length === 0) {
        body.innerHTML = '<tr><td class="empty" colspan="5" style="text-align:center;color:#78716C;padding:30px">ยังไม่มีรายชื่อช่าง</td></tr>';
        return;
      }
      // นับงานที่ยังไม่ปิดของช่างแต่ละคน
      const openJobs = {};
      allTickets.forEach(t => {
        const name = (t.AssignedTo || '').trim();
        if (!name) return;
        if (t.Status === 'เสร็จสิ้น' || t.Status === 'ปิดงาน' || t.Status === 'ยกเลิก') return;
        openJobs[name] = (openJobs[name] || 0) + 1;
      });

      body.innerHTML = techniciansAll.map(t => `
        <tr class="${t.active ? '' : 'inactive'}">
          <td data-label="ชื่อช่าง"><b>${esc(t.name)}</b></td>
          <td data-label="เบอร์โทร">${esc(t.phone) || '-'}</td>
          <td data-label="สถานะ">
            <span class="badge ${t.active ? 'เสร็จสิ้น' : 'ยกเลิก'}">${t.active ? 'ใช้งาน' : 'ปิดใช้งาน'}</span>
          </td>
          <td data-label="งานที่ถืออยู่">${openJobs[t.name] || 0}</td>
          <td class="actions" data-label="" style="white-space:nowrap">
            <span class="link" onclick="editTech(${t.row})">แก้ไข</span>
            &nbsp;
            <span class="link" onclick="toggleTech(${t.row}, ${t.active ? 'false' : 'true'})">${t.active ? 'ปิดใช้งาน' : 'เปิดใช้งาน'}</span>
            &nbsp;
            <span class="link danger" onclick="removeTech(${t.row})">ลบ</span>
          </td>
        </tr>`).join('');
    }

    function techMsg(text, isError) {
      const el = document.getElementById('techMsg');
      el.textContent = text || '';
      el.style.color = isError ? 'var(--danger)' : 'var(--teal)';
    }

    function addTech() {
      const nameEl = document.getElementById('techName');
      const phoneEl = document.getElementById('techPhone');
      const btn = document.getElementById('techAddBtn');
      const name = nameEl.value.trim();
      if (!name) { techMsg('กรุณากรอกชื่อช่าง', true); nameEl.focus(); return; }

      btn.disabled = true;
      techMsg('กำลังบันทึก...', false);
      google.script.run
        .withSuccessHandler(() => {
          btn.disabled = false;
          nameEl.value = ''; phoneEl.value = '';
          techMsg('เพิ่ม "' + name + '" เรียบร้อย', false);
          nameEl.focus();
          loadAll();
        })
        .withFailureHandler(err => { btn.disabled = false; techMsg(err.message, true); })
        .addTechnician(PIN, name, phoneEl.value.trim());
    }

    function editTech(row) {
      const tech = techniciansAll.find(t => t.row === row);
      if (!tech) return;
      const name = prompt('ชื่อช่าง:', tech.name);
      if (name === null) return;
      const phone = prompt('เบอร์โทร:', tech.phone);
      if (phone === null) return;
      runTechUpdate(row, { name: name.trim(), phone: phone.trim() });
    }

    function toggleTech(row, active) {
      runTechUpdate(row, { active: active });
    }

    function runTechUpdate(row, updates) {
      google.script.run
        .withSuccessHandler(() => { techMsg('บันทึกแล้ว', false); loadAll(); })
        .withFailureHandler(err => techMsg(err.message, true))
        .updateTechnician(PIN, row, updates);
    }

    function removeTech(row) {
      const tech = techniciansAll.find(t => t.row === row);
      if (!tech) return;
      if (!confirm('ลบ "' + tech.name + '" ออกจากรายชื่อช่าง?\n(งานที่มอบหมายไว้แล้วจะยังคงชื่อเดิม — ถ้าต้องการเก็บประวัติ แนะนำใช้ "ปิดใช้งาน" แทน)')) return;
      google.script.run
        .withSuccessHandler(() => { techMsg('ลบ "' + tech.name + '" แล้ว', false); loadAll(); })
        .withFailureHandler(err => techMsg(err.message, true))
        .deleteTechnician(PIN, row);
    }

    document.getElementById('techAddBtn').addEventListener('click', addTech);
    document.getElementById('techPhone').addEventListener('keydown', e => { if (e.key === 'Enter') addTech(); });
    document.getElementById('techName').addEventListener('keydown', e => { if (e.key === 'Enter') addTech(); });

    document.getElementById('searchBox').addEventListener('input', renderTable);
    document.getElementById('statusFilter').addEventListener('change', renderTable);
    document.getElementById('refreshBtn').addEventListener('click', loadAll);

    document.getElementById('tabDash').addEventListener('click', () => switchTab('dash'));
    document.getElementById('tabList').addEventListener('click', () => switchTab('list'));
    document.getElementById('tabTech').addEventListener('click', () => switchTab('tech'));
    function switchTab(which) {
      const views = { dash: 'viewDash', list: 'viewList', tech: 'viewTech' };
      const tabs = { dash: 'tabDash', list: 'tabList', tech: 'tabTech' };
      Object.keys(views).forEach(k => {
        document.getElementById(views[k]).style.display = k === which ? 'block' : 'none';
        document.getElementById(tabs[k]).classList.toggle('active', k === which);
      });
      if (which === 'tech') techMsg('', false);
    }
  </script>
</body>
</html>
